<section class="py-20 md:py-28 bg-[#060e1a] border-y border-white/5">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="text-center max-w-3xl mx-auto mb-16">
            <span class="section-badge"><i class="fa-regular fa-comment mr-2"></i> Testimonials</span>
            <h2 class="section-title">What Our <span class="text-cyan-400">Users Say</span></h2>
        </div>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for testimonial in testimonials %}
                <div class="bg-white/5 border border-white/5 rounded-2xl p-6 transition hover:bg-white/10">
                    <div class="flex items-center gap-4 mb-3">
                        <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center text-2xl text-blue-400">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <div class="text-white font-semibold">{{ testimonial.name }}</div>
                            <div class="text-gray-400 text-sm">{{ testimonial.designation }}</div>
                        </div>
                    </div>
                    <p class="text-gray-300 text-sm italic">"{{ testimonial.content }}"</p>
                    <div class="text-amber-400 text-sm mt-2">
                        {% for i in ""|ljust:testimonial.rating %}★{% endfor %}
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
