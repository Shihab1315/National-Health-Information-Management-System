<section class="py-16 md:py-20 bg-[#060e1a] border-y border-white/5">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="text-center mb-12">
            <span class="section-badge"><i class="fa-regular fa-handshake mr-2"></i> Our Partners</span>
            <h2 class="section-title">Trusted <span class="text-cyan-400">Healthcare Institutions</span></h2>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6">
            {% for partner in partners %}
                <div class="partner-item">
                    <div class="text-3xl text-blue-400 mb-2"><i class="fa-solid fa-hospital"></i></div>
                    <div class="text-white font-semibold">{{ partner.name }}</div>
                    <div class="text-gray-500 text-xs">{{ partner.location }}</div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
