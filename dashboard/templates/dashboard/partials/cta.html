<section class="py-16 md:py-20 bg-gradient-to-r from-blue-600 to-cyan-600">
    <div class="max-w-7xl mx-auto px-4 md:px-8 text-center">
        <h2 class="text-3xl md:text-4xl font-bold text-white">{{ cta.title }}</h2>
        {% if cta.subtitle %}
        <p class="text-blue-100 text-lg mt-2">{{ cta.subtitle }}</p>
        {% endif %}
        <a href="{{ cta.button_url|default:'#' }}" class="inline-block mt-6 bg-white text-blue-700 px-8 py-3 rounded-full font-semibold shadow-lg hover:shadow-xl transition hover:scale-105">
            {{ cta.button_text }}
        </a>
    </div>
</section>
