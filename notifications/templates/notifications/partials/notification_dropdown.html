{% load notification_tags %}
{% load static %}
<div class="relative" x-data="{ open: false }" @click.away="open = false">
    <button @click="open = !open" class="relative text-gray-400 hover:text-white transition-colors" id="notificationBell">
        <i class="fas fa-bell text-xl"></i>
        <span id="unread-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center font-bold">
            {% unread_notifications_count user %}
        </span>
    </button>

    <div x-show="open" class="absolute right-0 mt-2 w-80 sm:w-96 bg-[#111827] border border-white/10 rounded-xl shadow-2xl z-50 max-h-96 overflow-y-auto" id="notification-dropdown">
        <div class="flex justify-between items-center px-4 py-3 border-b border-white/10">
            <span class="text-sm font-medium text-white">Notifications</span>
            <a href="{% url 'notifications:center' %}" class="text-xs text-blue-400 hover:text-blue-300">View All</a>
        </div>
        <div id="dropdown-list" class="divide-y divide-white/5">
            {% for notification in notifications|slice:":10" %}
                {% include 'notifications/partials/notification_item.html' with notification=notification %}
            {% empty %}
                <div class="px-4 py-6 text-center text-gray-400 text-sm">No notifications</div>
            {% endfor %}
        </div>
        <div class="px-4 py-2 border-t border-white/10 text-center">
            <button id="mark-all-read-dropdown" class="text-xs text-gray-400 hover:text-white">Mark all as read</button>
        </div>
    </div>
</div>
