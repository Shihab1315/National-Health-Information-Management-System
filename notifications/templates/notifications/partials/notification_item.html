{% load notification_tags %}
<div class="glass-card p-4 flex items-start gap-3 transition hover:border-blue-500/30
    {% if not notification.is_read %} border-l-4 border-blue-500{% endif %}
    {% if notification.priority == 'critical' %} border-l-red-500{% endif %}
    {% if notification.priority == 'high' %} border-l-amber-500{% endif %}"
    data-notification-id="{{ notification.pk }}"
>
    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-[#1E293B] flex items-center justify-center text-{{ notification.color|default:'gray-400' }}">
        <i class="{{ notification.icon|default:'fas fa-bell' }}"></i>
    </div>
    <div class="flex-1 min-w-0">
        <div class="flex flex-wrap items-start justify-between gap-1">
            <span class="font-medium text-white">{{ notification.title }}</span>
            <span class="text-xs text-gray-400">{{ notification.created_at|timesince }} ago</span>
        </div>
        <p class="text-sm text-gray-400 mt-0.5">{{ notification.message }}</p>
        <div class="flex items-center gap-3 mt-1.5">
            {% if not notification.is_read %}
                <button class="mark-read-btn text-xs text-blue-400 hover:text-blue-300">Mark as Read</button>
            {% endif %}
            <button class="delete-btn text-xs text-red-400 hover:text-red-300">Delete</button>
            {% if notification.url %}
                <a href="{{ notification.url }}" class="text-xs text-green-400 hover:text-green-300">View Details</a>
            {% endif %}
        </div>
    </div>
</div>
