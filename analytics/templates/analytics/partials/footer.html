{% load static %}

<footer class="mt-8 pt-4 border-t border-white/10 bg-transparent">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-gray-400">
        <!-- Left side: Brand & Version -->
        <div class="flex items-center gap-3">
            <span class="font-medium text-white">NHIMS</span>
            <span class="text-gray-500">v2.0.0</span>
            <span class="hidden sm:inline text-gray-600">|</span>
            <span class="hidden sm:inline">
                &copy; {% firstof now|date:"Y" "2026" %} Ministry of Health
            </span>
        </div>

        <!-- Right side: Status Indicators -->
        <div class="flex items-center gap-4 flex-wrap justify-center">
            <!-- Server Status -->
            <div class="flex items-center gap-1.5">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-gray-400">Server</span>
            </div>
            <!-- Database Status -->
            <div class="flex items-center gap-1.5">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-gray-400">Database</span>
            </div>
            <!-- API Status -->
            <div class="flex items-center gap-1.5">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                </span>
                <span class="text-gray-400">API</span>
            </div>
        </div>
    </div>
</footer>
