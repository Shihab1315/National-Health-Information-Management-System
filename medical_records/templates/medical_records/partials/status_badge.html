{% if status == 'draft' %}
    <span class="bg-gray-500/20 text-gray-300 text-xs px-2 py-0.5 rounded-full">Draft</span>
{% elif status == 'active' %}
    <span class="bg-blue-500/20 text-blue-300 text-xs px-2 py-0.5 rounded-full">Active</span>
{% elif status == 'completed' %}
    <span class="bg-emerald-500/20 text-emerald-300 text-xs px-2 py-0.5 rounded-full">Completed</span>
{% elif status == 'cancelled' %}
    <span class="bg-red-500/20 text-red-300 text-xs px-2 py-0.5 rounded-full">Cancelled</span>
{% else %}
    <span class="bg-gray-500/20 text-gray-300 text-xs px-2 py-0.5 rounded-full">{{ status|default:"Unknown" }}</span>
{% endif %}
