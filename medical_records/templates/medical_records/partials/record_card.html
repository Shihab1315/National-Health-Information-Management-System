<div class="glass-card rounded-2xl border border-white/10 p-4 hover:border-blue-400/50 transition group">
    <div class="flex items-start justify-between">
        <div>
            <div class="text-white font-medium">{{ record.patient.full_name }}</div>
            <div class="text-gray-400 text-sm">{{ record.visit_date|date:"M d, Y" }}</div>
        </div>
        <div>
            {% include 'medical_records/partials/status_badge.html' with status=record.status %}
        </div>
    </div>
    <div class="mt-2 text-gray-300 text-sm">{{ record.diagnosis|truncatechars:50 }}</div>
    <div class="mt-3 flex justify-end gap-2">
        <a href="{% url 'medical_records:record_detail' record.pk %}" class="text-blue-400 hover:text-blue-300"><i class="fas fa-eye"></i></a>
        <a href="{% url 'medical_records:record_edit' record.pk %}" class="text-amber-400 hover:text-amber-300"><i class="fas fa-edit"></i></a>
    </div>
</div>
