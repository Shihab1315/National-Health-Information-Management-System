{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Hospital — NHIMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card rounded-2xl border border-white/10 p-8 text-center">
        <div class="text-6xl text-red-400 mb-4">
            <i class="fas fa-triangle-exclamation"></i>
        </div>
        <h2 class="text-2xl font-bold text-white mb-2">Confirm Deletion</h2>
        <p class="text-gray-400 mb-6">
            Are you sure you want to delete <strong class="text-white">{{ hospital.name }}</strong>?<br>
            This action cannot be undone.
        </p>
        <form method="post" class="flex flex-col sm:flex-row gap-3 justify-center">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-xl font-medium transition flex items-center justify-center gap-2">
                <i class="fas fa-trash-alt"></i> Yes, Delete
            </button>
            <a href="{% url 'hospitals:detail' hospital.slug %}" class="bg-white/5 hover:bg-white/10 px-8 py-3 rounded-xl text-gray-300 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
