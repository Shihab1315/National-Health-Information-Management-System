<tr class="hover:bg-white/5 transition group">
    <td class="px-6 py-4 text-white">{{ medicine.brand_name }}</td>
    <td class="px-6 py-4 text-gray-300 hidden md:table-cell">{{ medicine.generic_name|default:"—" }}</td>
    <td class="px-6 py-4 text-gray-300 hidden sm:table-cell">{{ medicine.category.name|default:"—" }}</td>
    <td class="px-6 py-4 text-emerald-400 font-medium">{{ medicine.current_stock }}</td>
    <td class="px-6 py-4">{% include 'pharmacy/partials/stock_badge.html' with medicine=medicine %}</td>
    <td class="px-6 py-4 text-right">
        <div class="flex items-center justify-end gap-2 opacity-70 group-hover:opacity-100 transition">
            <a href="{% url 'pharmacy:medicine_detail' medicine.pk %}" class="text-blue-400 hover:text-blue-300" title="View"><i class="fas fa-eye"></i></a>
            <a href="{% url 'pharmacy:medicine_edit' medicine.pk %}" class="text-amber-400 hover:text-amber-300" title="Edit"><i class="fas fa-edit"></i></a>
            <a href="{% url 'pharmacy:medicine_delete' medicine.pk %}" class="text-red-400 hover:text-red-300" title="Delete"><i class="fas fa-trash-alt"></i></a>
        </div>
    </td>
</tr>
