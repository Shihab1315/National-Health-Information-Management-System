{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Doctor — NHIMS{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-16">
    <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-8 text-center">
        <div class="text-6xl text-red-400 mb-4">
            <i class="fas fa-triangle-exclamation"></i>
        </div>
        <h2 class="text-2xl font-bold text-white mb-2">Are you sure?</h2>
        <p class="text-gray-400 mb-6">
            You are about to delete <strong class="text-white">Dr. {{ doctor.full_name }}</strong>.
            This action cannot be undone.
        </p>
        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-medium transition flex items-center gap-2">
                <i class="fas fa-trash-alt"></i> Yes, Delete
            </button>
            <a href="{% url 'doctors:detail' doctor.pk %}" class="bg-white/5 hover:bg-white/10 px-6 py-3 rounded-xl text-gray-300 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
