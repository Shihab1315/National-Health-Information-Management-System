{% extends 'base.html' %}
{% block title %}Profile — NHIMS{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-10">
    <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-8">
        <h2 class="text-3xl font-bold text-white mb-6">My Profile</h2>
        <div class="space-y-4 text-gray-300">
            <div><span class="text-gray-400">Username:</span> {{ user.username }}</div>
            <div><span class="text-gray-400">Full Name:</span> {{ user.get_full_name }}</div>
            <div><span class="text-gray-400">Email:</span> {{ user.email }}</div>
            <div><span class="text-gray-400">Joined:</span> {{ user.date_joined|date:"F d, Y" }}</div>
        </div>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="logout-btn" title="Logout"
            style="background:none;border:none;padding:0;cursor:pointer;">
        <i class="fas fa-sign-out-alt"></i>
    </button>
</form>
    </div>
</div>
{% endblock %}
