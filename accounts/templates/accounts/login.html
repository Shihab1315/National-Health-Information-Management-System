{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — NHIMS Bangladesh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ── Same dark theme as homepage ── */
        :root { --primary: #0a1628; --accent-blue: #3b82f6; --accent-teal: #06b6d4; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }
        /* Floating blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            pointer-events: none;
            animation: floatBlob 12s ease-in-out infinite alternate;
        }
        .blob-1 { width: 500px; height: 500px; background: #3b82f6; top: -15%; left: -15%; }
        .blob-2 { width: 400px; height: 400px; background: #06b6d4; bottom: -15%; right: -15%; animation-delay: 3s; }
        .blob-3 { width: 250px; height: 250px; background: #10b981; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 6s; opacity: 0.15; }
        @keyframes floatBlob {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(40px,40px) scale(1.3); }
        }
        /* Glass card */
        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            border-radius: 32px;
            padding: 44px 48px;
            width: 100%;
            max-width: 440px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            z-index: 10;
        }
        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            border-color: rgba(59,130,246,0.2);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 4px 20px rgba(59,130,246,0.4);
        }
        .brand-text {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .brand-text span { color: #06b6d4; font-weight: 400; font-size: 16px; margin-left: 4px; }
        .login-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 30%, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }
        .login-sub { color: #94a3b8; font-size: 15px; margin-top: 2px; }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #e2e8f0;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }
        .input-group input:focus {
            border-color: #3b82f6;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
            transform: scale(1.02);
        }
        .input-group input::placeholder { color: #64748b; font-weight: 300; }
        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 18px;
            transition: color 0.3s;
            pointer-events: none;
        }
        .input-group:focus-within .input-icon { color: #3b82f6; }
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(59,130,246,0.35);
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(59,130,246,0.5);
        }
        .btn-login:active { transform: scale(0.97); }
        .signup-link { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 14px; }
        .signup-link a { color: #06b6d4; font-weight: 600; text-decoration: none; position: relative; transition: color 0.3s; }
        .signup-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            transition: width 0.3s;
        }
        .signup-link a:hover { color: #fff; }
        .signup-link a:hover::after { width: 100%; }
        .message-box {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.5s ease;
        }
        .message-box.success {
            background: rgba(16,185,129,0.15);
            border-color: rgba(16,185,129,0.25);
            color: #6ee7b7;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        @media (max-width: 480px) {
            .glass-card { padding: 28px 20px; margin: 0 16px; }
            .brand-text { font-size: 20px; }
            .login-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="glass-card">
        <div class="brand">
            <div class="brand-icon">N</div>
            <div class="brand-text">NHIMS <span>Bangladesh</span></div>
        </div>
        <div class="login-title">Welcome Back</div>
        <p class="login-sub">Sign in to access your NHIMS dashboard</p>

        <form method="post" class="mt-6">
            {% csrf_token %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message-box {% if message.tags == 'success' %}success{% endif %}">
                        <i class="fa-regular fa-circle-exclamation"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required autofocus>
                <span class="input-icon"><i class="fa-regular fa-user"></i></span>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
                <span class="input-icon"><i class="fa-regular fa-lock"></i></span>
            </div>
            <button type="submit" class="btn-login">
                <i class="fa-regular fa-arrow-right-to-bracket mr-2"></i> Login
            </button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="{% url 'accounts:signup' %}">Sign up now</a>
        </div>
    </div>

    <script>
        // Spinner on submit
        document.querySelector('form').addEventListener('submit', function(e) {
            const btn = this.querySelector('.btn-login');
            btn.innerHTML = '<i class="fa-regular fa-spinner fa-spin mr-2"></i> Logging in...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
