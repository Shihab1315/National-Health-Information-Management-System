{% if status == 'pending' %}
    <span class="bg-yellow-500/20 text-yellow-300 text-xs px-3 py-1 rounded-full">Pending</span>
{% elif status == 'confirmed' %}
    <span class="bg-blue-500/20 text-blue-300 text-xs px-3 py-1 rounded-full">Confirmed</span>
{% elif status == 'completed' %}
    <span class="bg-emerald-500/20 text-emerald-300 text-xs px-3 py-1 rounded-full">Completed</span>
{% elif status == 'cancelled' %}
    <span class="bg-red-500/20 text-red-300 text-xs px-3 py-1 rounded-full">Cancelled</span>
{% elif status == 'no_show' %}
    <span class="bg-gray-500/20 text-gray-300 text-xs px-3 py-1 rounded-full">No Show</span>
{% else %}
    <span class="bg-gray-500/20 text-gray-300 text-xs px-3 py-1 rounded-full">{{ status }}</span>
{% endif %}
